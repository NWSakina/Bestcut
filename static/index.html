<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bestcut</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(180deg,#0b1220 0%,#131c2e 55%,#1a2335 100%);
color:#fff;
font-family:Arial,sans-serif;
height:100vh;
overflow:auto;
}

.app{
display:flex;
flex-direction:column;
height:100vh;
}

header{
height:7vh;
display:flex;
flex-direction:row;
direction:ltr;
justify-content:space-between;
align-items:center;
padding:0 20px;
background:#111827;
border-bottom:1px solid #273449;
}

header h1{
font-size:34px;
font-weight:bold;
text-shadow:
0 0 1px #fff3b0,
0 0 3px #d4af37,
0 0 6px #d4af37,
0 0 10px rgba(212,175,55,.9);
}

header p{
margin-top:0;
font-size:18px;
color:#ffffff;
width:50%;
text-align:right;
line-height:1.2;
text-shadow:
0 0 1px #fff3b0,
0 0 3px #d4af37,
0 0 6px #d4af37,
0 0 10px rgba(212,175,55,.9);
}

.viewer{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:10px 10px 0 10px;
background:#0f172a;
overflow:hidden;
}

.preview{
position:relative;
width:min(90vw,360px);
aspect-ratio:9/16;
background:#000;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

#textLayer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:15;
}

.preview video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

#subtitleOverlay{
position:absolute;
top:30%;
left:50%;
transform:translate(-50%,-50%);
display:block;
width:70%;
max-width:70%;
padding:10px 18px;
background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.22);
border-radius:24px;
backdrop-filter:blur(2px);
-webkit-backdrop-filter:blur(2px);
color:#fff;
font-size:20px;
font-weight:bold;
text-align:center;
line-height:1.4;
white-space:pre-wrap;
word-break:keep-all;
text-shadow:0 2px 8px rgba(0,0,0,.8);
pointer-events:none;
}

#textOverlay{
    position:absolute;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    width:max-content !important;
    min-width:auto !important;
    max-width:none !important;
    height:auto !important;
    min-height:auto !important;
    max-height:none !important;
    white-space:nowrap !important;
    padding:10px 18px;
    border-radius:16px; 
    background:#ffffff;
    backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,.9);
    color:#fff;
    font-family:'Scheherazade New', sans-serif;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    outline:none;
    display:none;
    z-index:20;
    pointer-events:auto;
}

.selected{
border:2px solid #00bfff !important;
}

.toolbar{
height:90px;
width:95%;
max-width:420px;
margin:0 auto;
background:#1f2937;
border-top:1px solid #334155;
display:flex;
align-items:center;
gap:8px;
padding:10px;
overflow-x:auto;
overflow-y:hidden;
flex-wrap:nowrap;
white-space:nowrap;
border-radius:18px 18px 0 0;
}

#uploadBtn{
height:48px;
padding:0 22px;
border:none;
border-radius:14px;
background:#2563eb;
color:#fff;
font-size:18px;
cursor:pointer;
}

.toolIcon{
    width:48px;
    height:48px;
    min-width:48px;
    padding:0;
    border:none;
    border-radius:16px;
    background:#b8860b;
    color:#ffffff;
    font-size:26px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:0.2s;
}

#colorPicker {
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 16px;
    background: #374151;
    cursor: pointer;
    padding: 5px;
}

.colorTool {
    position:relative;
    text-align:center;
    line-height:1.1;
    font-size:12px;
    font-weight:bold;
}

#colorTargetMenu {
    display:none;
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    z-index:1000;
    flex-direction:row;
    gap:8px;
    padding:8px;
    background:rgba(0,0,0,.85);
    border:1px solid rgba(255,255,255,.25);
    border-radius:10px;
    white-space:nowrap;
}

#colorTargetMenu button {
    padding:8px 14px;
    border:none;
    border-radius:6px;
    background:#374151;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

#backgroundOpacityPanel {
    display:none;
    position:absolute;
    left:50%;
    bottom:130px;
    width:min(90vw,360px);
    box-sizing:border-box;
    transform:translateX(-50%);
    align-items:center;
    gap:8px;
    z-index:1000;
    padding:6px 8px;
    background:#ffffff;
    border-radius:16px;
    pointer-events:none;
}

#backgroundOpacityPanel input,
#backgroundOpacityPanel span,
#backgroundOpacityPanel button {
    pointer-events:auto;
}

#backgroundOpacityPicker {
    width:220px;
    height:4px;
    accent-color:#d4af37;
    cursor:pointer;
}

#exportProgressPanel {
    display:none;
    position:absolute;
    left:50%;
    bottom:130px;
    width:min(90vw,360px);
    height:6px;
    box-sizing:border-box;
    transform:translateX(-50%);
    z-index:1000;
    padding:0;
    background:#ffffff;
    border-radius:16px;
    overflow:hidden;
}

#exportProgressBar {
    width:0%;
    height:100%;
    background:#d4af37;
    border-radius:16px;
    transition:width .2s ease;
}

#backgroundOpacityValue {
    min-width:36px;
    color:#ffffff;
    font-size:12px;
    font-weight:bold;
    text-align:center;
}

#backgroundOpacityOk {
    border:none;
    padding:3px 7px;
    border-radius:8px;
    background:#2563eb;
    color:#ffffff;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.colorTool input[type="color"] {
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

.toolIcon:hover{
background:#4b5563;
transform:scale(1.05);
}

.toolIcon:active{
transform:scale(0.96);
}

#status{
flex:1;
font-size:15px;
color:#d1d5db;
padding-right:8px;
}

#videoFile{
display:none;
}

/* ===== قائمة إصلاح الترجمة ===== */
#subtitleEditorPanel{
display:none;
width:100%;
box-sizing:border-box;
max-height:45vh;
overflow-y:auto;
padding:8px;
background:#111827;
border-radius:8px;
margin-bottom:8px;
}

.subtitleEditorItem{
width:100%;
box-sizing:border-box;
min-height:42px;
padding:8px 10px;
margin-bottom:6px;
background:#1f2937;
border:1px solid #4b5563;
border-radius:7px;
color:#ffffff;
font-size:14px;
line-height:1.5;
direction:rtl;
text-align:right;
outline:none;
}

.subtitleEditorItem:focus{
border-color:#9ca3af;
background:#374151;
}

#result{
display:none;
}

/* ===== شريط الكبسولات الزمني ===== */
#capsuleTimeline{
    display:none;
    width:100%;
    box-sizing:border-box;
    padding:8px 8px 10px;
    background:#111827;
}

#capsuleViewport{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
}

#capsuleTimeInfo{
    width:100%;
    box-sizing:border-box;
    text-align:center;
    font-size:12px;
    color:#ffffff;
    margin-top:6px;
    white-space:nowrap;
    transform:translateY(2px);
}

#timelineRuler{
display:none;
height:22px;
margin-bottom:4px;
font-size:10px;
color:#d1d5db;
white-space:nowrap;
}

.timelineMark{
position:absolute;
top:0;
transform:translateX(-50%);
}

#capsuleTrack{
position:relative;
height:38px;
min-width:100%;
background:#1f2937;
border-radius:8px;
overflow:hidden;
}

.subtitleCapsule{
position:absolute;
top:5px;
height:33px;
box-sizing:border-box;
padding:4px 7px;
border:1px solid #6b7280;
border-radius:7px;
background:#374151;
color:#ffffff;
font-size:12px;
line-height:25px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
text-align:center;
}

.subtitleCapsule.selectedCapsule{
    border:2px solid #ffffff;
    background:#4b5563;
    box-shadow:0 0 0 2px #9ca3af;
}

.capsuleEndHandle{
    position:absolute;
    right:0;
    top:0;
    width:10px;
    height:100%;
    cursor:ew-resize;
    background:#ffffff;
    opacity:0;
    touch-action:none;
    z-index:5;
}

.capsuleStartHandle{
    position:absolute;
    left:0;
    top:0;
    width:10px;
    height:100%;
    cursor:ew-resize;
    background:#ffffff;
    opacity:0;
    touch-action:none;
    z-index:5;
}

.subtitleCapsule.selectedCapsule .capsuleStartHandle{
    opacity:1;
}

.subtitleCapsule.selectedCapsule .capsuleEndHandle{
    opacity:1;
}

.subtitleCapsule.selectedCapsule::before{
    content:"";
    position:absolute;
    left:2px;
    top:0;
    bottom:0;
    width:2px;
    background:#ffffff;
}

.subtitleCapsule.selectedCapsule::after{
    content:"";
    position:absolute;
    right:2px;
    top:0;
    bottom:0;
    width:2px;
    background:#ffffff;
}

</style>
</head>

<body>

<div class="app">

<header>
<h1>Bestcut</h1>
<p>ذكاء اصطناعي لمعالجة الفيديو والترجمة</p>
</header>

<div class="viewer">

<div class="preview">

<video
id="videoPreview"
controls>
</video>

<div id="textLayer"></div>

اكتب النص...

<div id="textOverlay" contenteditable="true">
اكتب النص...
</div>

<div id="colorTargetMenu">
    <button type="button" id="colorTargetSubtitle">الترجمة</button>
    <button type="button" id="colorTargetCustom">العناوين</button>
</div>

<div id="subtitleOverlay">
النص سيظهر هنا
</div>

<div id="backgroundOpacityPanel">
    <button type="button" id="backgroundOpacitySubtitle">الترجمة</button>
    <button type="button" id="backgroundOpacityCustom">العناوين</button>
    <input type="range" id="backgroundOpacityPicker" min="0" max="100" value="43" step="1">

</div>

</div>

<!-- ===== شريط الكبسولات الزمني ===== -->
<div id="capsuleTimeline">

    <div id="capsuleViewport">

        <div id="timelineRuler"></div>

        <div id="capsuleTrack"></div>

    </div>

    <div id="capsuleTimeInfo"></div>

</div>

<!-- ===== قائمة إصلاح الترجمة ===== -->
<div id="subtitleEditorPanel">

    <div id="subtitleEditorList"></div>

    <button id="subtitleEditorOk" type="button">
        OK
    </button>

</div>

<div class="toolbar">

    <input type="file" id="videoFile" accept="video/*">

    <div class="toolIcon colorTool" id="pickVideoBtn" title="اختيار فيديو">
        اختيار<br>فيديو
    </div>

    <button id="uploadBtn">
        بدء المعالجة
    </button>

    <div class="toolIcon colorTool" id="subtitleBtn" title="أدوات الترجمة">
        إصلاح<br>الترجمة
    </div>

    <div class="toolIcon colorTool" id="colorPickerBtn" title="لون الخط">
        لون<br>الخط

        <input type="color" id="colorPicker" value="#ffffff">
    </div>

    <div class="toolIcon colorTool" id="shadowColorPickerBtn" title="لون الظل">
        لون<br>الظل
        <input type="color" id="shadowColorPicker" value="#000000">
    </div>

    <div class="toolIcon colorTool" id="backgroundColorPickerBtn" title="لون الخلفية">
        لون<br>الخلفية
        <input type="color" id="backgroundColorPicker" value="#ffffff">
    </div>

    <div class="toolIcon colorTool" id="backgroundOpacityBtn" title="شفافية الخلفية">
        شفافية<br>الخلفية
    </div>

    <div class="toolIcon colorTool" id="addTextBtn" title="إضافة عناوين">
        إضافة<br>عناوين
    </div>

    <button
        class="toolIcon"
        id="fontStyleBtn"
        title="نمط الخط"
        style="font-size: 12px; line-height: 1.1;">
        نمط<br>الخط
    </button>

    <button
        class="toolIcon"
        id="exportBtn"
        title="تحميل الفيديو النهائي">
        ⬇️
    </button>

</div>

<textarea
id="result"
readonly
placeholder="سيظهر النص هنا..."></textarea>

<script>

const result=document.getElementById("result");
const video=document.getElementById("videoPreview");
const overlay=document.getElementById("subtitleOverlay");
overlay.style.textShadow = "2px 2px 4px #000000";
const textOverlay=document.getElementById("textOverlay");
textOverlay.onclick=()=>{document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));textOverlay.classList.add("selected");};
const addTextBtn=document.getElementById("addTextBtn");
const exportBtn=document.getElementById("exportBtn");
let colorTarget = "subtitle";
let backgroundOpacityTarget = "subtitle";

let subtitleTextColor = "#ffffff";
let customTextColor = "#ffffff";

let subtitleShadowColor = "#000000";
let customShadowColor = "#000000";

let subtitleBackgroundColor = "#ffffff";
let customBackgroundColor = "#ffffff";

let subtitleBackgroundOpacity = 43;
let customBackgroundOpacity = 43;

const colorPicker = document.getElementById("colorPicker");
let activeColorPicker = colorPicker;

const colorPickerBtn = document.getElementById("colorPickerBtn");
const colorTargetMenu = document.getElementById("colorTargetMenu");

colorPickerBtn.onclick = () => {
    activeColorPicker = colorPicker;
    colorTargetMenu.style.display =
        colorTargetMenu.style.display === "flex" ? "none" : "flex";
};

const colorTargetSubtitle = document.getElementById("colorTargetSubtitle");
const colorTargetCustom = document.getElementById("colorTargetCustom");

colorTargetSubtitle.onclick = () => {
    colorTarget = "subtitle";
    colorPicker.value = subtitleTextColor;
    colorTargetMenu.style.display = "none";
    activeColorPicker.click();
};

colorTargetCustom.onclick = () => {
    colorTarget = "custom";
    colorPicker.value = customTextColor;
    colorTargetMenu.style.display = "none";
    activeColorPicker.click();
};

const backgroundColorPicker = document.getElementById("backgroundColorPicker");
const backgroundColorPickerBtn = document.getElementById("backgroundColorPickerBtn");
const shadowColorPickerBtn = document.getElementById("shadowColorPickerBtn");

shadowColorPickerBtn.onclick = () => {
    activeColorPicker = shadowColorPicker;
    colorTargetMenu.style.display =
        colorTargetMenu.style.display === "flex" ? "none" : "flex";
};

backgroundColorPickerBtn.onclick = () => {
    activeColorPicker = backgroundColorPicker;
    colorTargetMenu.style.display =
        colorTargetMenu.style.display === "flex" ? "none" : "flex";
};

backgroundColorPicker.oninput = () => {
    const bgColor = backgroundColorPicker.value;

    if (colorTarget === "subtitle") {
        subtitleBackgroundColor = bgColor;
    } else if (colorTarget === "custom") {
        customBackgroundColor = bgColor;
    }

    const opacity = parseInt(backgroundOpacityPicker.value, 10) / 100;
    const r = parseInt(bgColor.slice(1, 3), 16);
    const g = parseInt(bgColor.slice(3, 5), 16);
    const b = parseInt(bgColor.slice(5, 7), 16);
    const background = `rgba(${r}, ${g}, ${b}, ${opacity})`;

    if (colorTarget === "subtitle") {
        subtitleOverlay.style.background = background;
    } else if (colorTarget === "custom") {
        document.querySelectorAll("#textLayer > div").forEach(el => {
            el.style.background = background;
        });
    }
};

const backgroundOpacityPicker = document.getElementById("backgroundOpacityPicker");
const backgroundOpacityBtn = document.getElementById("backgroundOpacityBtn");
const backgroundOpacityPanel = document.getElementById("backgroundOpacityPanel");
const backgroundOpacityValue = document.getElementById("backgroundOpacityValue");
const backgroundOpacitySubtitle = document.getElementById("backgroundOpacitySubtitle");
const backgroundOpacityCustom = document.getElementById("backgroundOpacityCustom");

backgroundOpacitySubtitle.onclick = () => {
};

backgroundOpacityCustom.onclick = () => {
    backgroundOpacityTarget = "custom";
};

backgroundOpacityBtn.onclick = () => {
    backgroundOpacityTarget = "subtitle";
    backgroundOpacityPanel.style.display = "flex";
};

backgroundOpacityPicker.oninput = () => {
    backgroundOpacityValue.textContent = backgroundOpacityPicker.value + "%";

    const opacityValue = parseInt(backgroundOpacityPicker.value, 10);

    if (backgroundOpacityTarget === "subtitle") {
        subtitleBackgroundOpacity = opacityValue;
    } else if (backgroundOpacityTarget === "custom") {
        customBackgroundOpacity = opacityValue;
    }

    const opacity = opacityValue / 100;
    const bgColor = backgroundOpacityTarget === "subtitle"
        ? subtitleBackgroundColor
        : customBackgroundColor;
    const r = parseInt(bgColor.slice(1, 3), 16);
    const g = parseInt(bgColor.slice(3, 5), 16);
    const b = parseInt(bgColor.slice(5, 7), 16);
    const background = `rgba(${r}, ${g}, ${b}, ${opacity})`;

    if (backgroundOpacityTarget === "subtitle") {
        subtitleOverlay.style.background = background;
    } else if (backgroundOpacityTarget === "custom") {
        document.querySelectorAll("#textLayer > div").forEach(el => {
            el.style.background = background;
        });
    }
};

const backgroundOpacityOk = document.getElementById("backgroundOpacityOk");

backgroundOpacityOk.onclick = () => {
    backgroundOpacityPanel.style.display = "none";
};

colorPicker.oninput = () => {
    if (colorTarget === "subtitle") {
        subtitleTextColor = colorPicker.value;
        subtitleOverlay.style.color = subtitleTextColor;
    } else if (colorTarget === "custom") {
        customTextColor = colorPicker.value;
        document.querySelectorAll("#textLayer > div").forEach(el => {
            el.style.color = customTextColor;
        });
    }
};

const subtitleBtn=document.getElementById("subtitleBtn");
const uploadBtn=document.getElementById("uploadBtn");
const videoFile=document.getElementById("videoFile");
const pickVideoBtn=document.getElementById("pickVideoBtn");
let currentSubtitleIndex = -1;
let subtitles = [];
let srtText = "";
const capsuleTimeline = document.getElementById("capsuleTimeline");
const timelineRuler = document.getElementById("timelineRuler");
const capsuleTrack = document.getElementById("capsuleTrack");

function timeStringToSeconds(value){
    if(!value) return 0;

    const parts = value.replace(",", ".").trim().split(":");

    if(parts.length !== 3) return 0;

    return (
        parseFloat(parts[0]) * 3600 +
        parseFloat(parts[1]) * 60 +
        parseFloat(parts[2])
    );
}

function secondsToTimeString(seconds){
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const milliseconds = Math.round((seconds - Math.floor(seconds)) * 1000);

    return String(hours).padStart(2, "0") + ":" +
           String(minutes).padStart(2, "0") + ":" +
           String(secs).padStart(2, "0") + "," +
           String(milliseconds).padStart(3, "0");
}

function renderCapsules(){

    if(!subtitles || subtitles.length === 0){
        capsuleTimeline.style.display = "none";
        return;
    }

    const duration = video.duration;

    if(!duration || !isFinite(duration)){
        return;
    }

    capsuleTimeline.style.display = "block";

    document.getElementById("capsuleTimeInfo").textContent =
        "مدة الفيديو: " + secondsToTimeString(duration);

    timelineRuler.innerHTML = "";
    capsuleTrack.innerHTML = "";

    /* ===== عرض زمني حقيقي للشريط ===== */
    const timelineWidth = Math.max(100, duration * 20);

    timelineRuler.style.width = timelineWidth + "px";
    capsuleTrack.style.width = timelineWidth + "px";

    subtitles.forEach((subtitle, index) => {

        const start = timeStringToSeconds(subtitle.start);
        const end = timeStringToSeconds(subtitle.end);

        if(end <= start) return;

        const left = Math.max(
            0,
            Math.min(100, (start / duration) * 100)
        );

        const width = Math.max(
            0.5,
            Math.min(
                100 - left,
                ((end - start) / duration) * 100
            )
        );

        const capsule = document.createElement("div");

        capsule.className = "subtitleCapsule";
        capsule.style.left = left + "%";
        capsule.style.width = width + "%";

        const startHandle = document.createElement("div");

        startHandle.className = "capsuleStartHandle";

        capsule.appendChild(startHandle);

        const endHandle = document.createElement("div");

        endHandle.className = "capsuleEndHandle";

        capsule.appendChild(endHandle);

        capsule.appendChild(document.createTextNode(subtitle.text || ""));

        capsule.title =
            (subtitle.text || "") +
            "\n" +
            subtitle.start +
            " → " +
            subtitle.end;

        capsule.dataset.index = index;

        endHandle.addEventListener("pointerdown", (e) => {

            e.preventDefault();
            e.stopPropagation();

            endHandle.setPointerCapture(e.pointerId);

            const startTime = timeStringToSeconds(subtitle.start);

            const onPointerMove = (moveEvent) => {

                const rect = capsuleTrack.getBoundingClientRect();

                if(!rect.width){
                    return;
                }

                const x = moveEvent.clientX - rect.left;

                const nextSubtitle = subtitles[index + 1];

                const maxEnd = nextSubtitle
                    ? timeStringToSeconds(nextSubtitle.start)
                    : duration;

                const newEnd = Math.max(
                    startTime + 0.1,
                    Math.min(maxEnd, (x / rect.width) * duration)
                );

                subtitle.end = secondsToTimeString(newEnd);

                srtText = buildSrt(subtitles);

                capsule.style.width =
                    Math.max(
                        0.5,
                        ((newEnd - startTime) / duration) * 100
                    ) + "%";

                capsule.title =
                    (subtitle.text || "") +
                    "\n" +
                    subtitle.start +
                    " → " +
                    subtitle.end;

                const capsuleTimeInfo =
                    document.getElementById("capsuleTimeInfo");

                capsuleTimeInfo.textContent =
                    subtitle.start + " → " + subtitle.end;
            };

            const onPointerUp = (upEvent) => {

                endHandle.releasePointerCapture(upEvent.pointerId);

                endHandle.removeEventListener("pointermove", onPointerMove);
                endHandle.removeEventListener("pointerup", onPointerUp);
                endHandle.removeEventListener("pointercancel", onPointerUp);

                renderCapsules();
            };

            endHandle.addEventListener("pointermove", onPointerMove);
            endHandle.addEventListener("pointerup", onPointerUp);
            endHandle.addEventListener("pointercancel", onPointerUp);
        });

        startHandle.addEventListener("pointerdown", (e) => {

            e.preventDefault();
            e.stopPropagation();

            startHandle.setPointerCapture(e.pointerId);

            const endTime = timeStringToSeconds(subtitle.end);

            const onPointerMove = (moveEvent) => {

                const rect = capsuleTrack.getBoundingClientRect();

                if(!rect.width){
                    return;
                }

                const x = moveEvent.clientX - rect.left;

                const previousSubtitle = subtitles[index - 1];

                const minStart = previousSubtitle
                    ? timeStringToSeconds(previousSubtitle.end)
                    : 0;

                const newStart = Math.max(
                    minStart,
                    Math.min(endTime - 0.1, (x / rect.width) * duration)
                );

                subtitle.start = secondsToTimeString(newStart);

                srtText = buildSrt(subtitles);

                capsule.style.left =
                    (newStart / duration) * 100 + "%";

                capsule.style.width =
                    Math.max(
                        0.5,
                        ((endTime - newStart) / duration) * 100
                    ) + "%";

                capsule.title =
                    (subtitle.text || "") +
                    "\n" +
                    subtitle.start +
                    " → " +
                    subtitle.end;

                const capsuleTimeInfo =
                    document.getElementById("capsuleTimeInfo");

                capsuleTimeInfo.textContent =
                    subtitle.start + " → " + subtitle.end;
            };

            const onPointerUp = (upEvent) => {

                startHandle.releasePointerCapture(upEvent.pointerId);

                startHandle.removeEventListener("pointermove", onPointerMove);
                startHandle.removeEventListener("pointerup", onPointerUp);
                startHandle.removeEventListener("pointercancel", onPointerUp);

                renderCapsules();
            };

            startHandle.addEventListener("pointermove", onPointerMove);
            startHandle.addEventListener("pointerup", onPointerUp);
            startHandle.addEventListener("pointercancel", onPointerUp);
        });

        capsule.addEventListener("click", () => {

            document
                .querySelectorAll(".subtitleCapsule.selectedCapsule")
                .forEach(el => el.classList.remove("selectedCapsule"));

            capsule.classList.add("selectedCapsule");

            currentSubtitleIndex = index;

            const startTime = timeStringToSeconds(subtitle.start);

            if(isFinite(startTime)){
                video.currentTime = startTime;
            }

            overlay.textContent = subtitle.text || "";

            const capsuleTimeInfo = document.getElementById("capsuleTimeInfo");

            capsuleTimeInfo.textContent =
                subtitle.start + " → " + subtitle.end;
        });

        capsuleTrack.appendChild(capsule);
    });
}
function buildSrt(subtitles){
    return subtitles.map((s,i)=>`${i+1}
${s.start} --> ${s.end}
${s.text}`).join("\n\n");
}

addTextBtn.onclick=()=>{
    const copy=textOverlay.cloneNode(true);
    copy.removeAttribute("id");
    copy.style.whiteSpace = "nowrap";
    copy.style.width = "max-content";
    copy.style.maxWidth = "none";
    copy.style.fontSize = "32px";
    copy.style.background = "rgba(255,255,255,0.18)";
    copy.style.borderRadius = "16px";
    copy.contentEditable="true";
    copy.style.pointerEvents="auto";
    copy.style.display="block";
    copy.style.position="absolute";
    copy.style.top="40px";
    copy.style.left="50%";
    copy.style.transform="translateX(-50%)";
    copy.textContent="";

    const offsetCount = textLayer.children.length;
    copy.style.position = "absolute";
    copy.style.top = (35 + (offsetCount * 40)) + "px";
    textLayer.appendChild(copy);

    // --- آلية الحركة والتحجيم باللمس ---
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    copy.scale = 1;
    copy.lastDistance = null;
    copy.currentLeft = null;
    copy.currentTop = null;

    copy.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;

            const rect = copy.getBoundingClientRect();
            const parentRect = textLayer.getBoundingClientRect();

            initialLeft = rect.left - parentRect.left;
            initialTop = rect.top - parentRect.top;

            copy.style.right = 'auto';

            if (copy.currentLeft === null) {
                copy.currentLeft = initialLeft;
            }

            if (copy.currentTop === null) {
                copy.currentTop = initialTop;
            }

            copy.style.left = copy.currentLeft + 'px';
            copy.style.top = copy.currentTop + 'px';
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            copy.lastDistance = Math.hypot(dx, dy);
        }
    }, { passive: false });

    window.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1 && isDragging) {
            e.preventDefault();

            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;

            copy.currentLeft = initialLeft + dx;
            copy.currentTop = initialTop + dy;

            copy.style.left = copy.currentLeft + 'px';
            copy.style.top = copy.currentTop + 'px';

        } else if (e.touches.length === 2 && e.target === copy) {
            e.preventDefault();

            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const distance = Math.hypot(dx, dy);

            if (copy.lastDistance) {
                const scaleFactor = distance / copy.lastDistance;

                copy.scale *= scaleFactor;
                copy.scale = Math.max(0.5, Math.min(copy.scale, 3));

                copy.style.transform = `scale(${copy.scale})`;
            }

            copy.lastDistance = distance;
        }
    }, { passive: false });

    window.addEventListener('touchend', function(e) {
        isDragging = false;
        copy.lastDistance = null;
    });

    copy.focus();

    copy.onclick=()=>{
        document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
        copy.classList.add("selected");
        backgroundOpacityTarget = "custom";
    };

    copy.tabIndex=0;
};

subtitleBtn.onclick=()=>{
    backgroundOpacityTarget = "subtitle";
    if(!subtitles || subtitles.length===0){
        alert("قم بمعالجة الفيديو أولاً لإنشاء الترجمة.");
        return;
    }

    capsuleTimeline.style.display = "block";

    const editorPanel = document.getElementById("subtitleEditorPanel");
    const editorList = document.getElementById("subtitleEditorList");

    editorList.innerHTML = "";

    subtitles.forEach((subtitle, index) => {

        const item = document.createElement("div");

        item.className = "subtitleEditorItem";
        item.contentEditable = "true";
        item.textContent = subtitle.text || "";
        item.dataset.index = index;

        item.addEventListener("focus", () => {

            currentSubtitleIndex = index;

            const startTime = timeStringToSeconds(subtitle.start);

            if(isFinite(startTime)){
                video.currentTime = startTime;
            }

            overlay.textContent = item.textContent;
        });

        item.addEventListener("input", () => {

            subtitles[index].text = item.innerText.trim();

            srtText = buildSrt(subtitles);

            if(currentSubtitleIndex === index){
                overlay.textContent = item.innerText.trim();
            }
        });

        item.addEventListener("keydown", (e) => {

            if(e.key === "Backspace"){

                const selection = window.getSelection();

                if(!selection || selection.rangeCount === 0){
                    return;
                }

                const range = selection.getRangeAt(0);

                if(!item.contains(range.startContainer)){
                    return;
                }

                const text = item.innerText;
                const cursorPosition = (() => {
                    const preRange = document.createRange();
                    preRange.selectNodeContents(item);
                    preRange.setEnd(range.startContainer, range.startOffset);
                    return preRange.toString().length;
                })();

                if(cursorPosition !== 0){
                    return;
                }

                if(index <= 0){
                    return;
                }

                e.preventDefault();

                const previousSubtitle = subtitles[index - 1];
                const currentSubtitle = subtitles[index];

                previousSubtitle.text =
                    (previousSubtitle.text + " " + currentSubtitle.text).trim();

                previousSubtitle.end = currentSubtitle.end;

                subtitles.splice(index, 1);

                srtText = buildSrt(subtitles);

                editorList.innerHTML = "";

                subtitles.forEach((subtitle, newIndex) => {

                    const newItem = document.createElement("div");

                    newItem.className = "subtitleEditorItem";
                    newItem.contentEditable = "true";
                    newItem.textContent = subtitle.text || "";
                    newItem.dataset.index = newIndex;

                    newItem.addEventListener("focus", () => {

                        currentSubtitleIndex = newIndex;

                        const startTime = timeStringToSeconds(subtitle.start);

                        if(isFinite(startTime)){
                            video.currentTime = startTime;
                        }

                        overlay.textContent = newItem.textContent;
                    });

                    newItem.addEventListener("input", () => {

                        subtitles[newIndex].text = newItem.innerText.trim();

                        srtText = buildSrt(subtitles);

                        if(currentSubtitleIndex === newIndex){
                            overlay.textContent = newItem.innerText.trim();
                        }
                    });

                    editorList.appendChild(newItem);
                });

                const mergedItem = editorList.querySelectorAll(".subtitleEditorItem")[index - 1];

                if(mergedItem){
                    mergedItem.focus();

                    const mergedRange = document.createRange();
                    mergedRange.selectNodeContents(mergedItem);
                    mergedRange.collapse(false);

                    const mergedSelection = window.getSelection();
                    mergedSelection.removeAllRanges();
                    mergedSelection.addRange(mergedRange);
                }

                currentSubtitleIndex = index - 1;

                status.textContent="تم دمج الجزأين";

                return;
            }

            if(e.key !== "Enter"){
                return;
            }

            e.preventDefault();

            const selection = window.getSelection();

            if(!selection || selection.rangeCount === 0){
                return;
            }

            const range = selection.getRangeAt(0);

            if(!item.contains(range.startContainer)){
                return;
            }

            const text = item.innerText;
            const cursorPosition = (() => {
                const preRange = document.createRange();
                preRange.selectNodeContents(item);
                preRange.setEnd(range.startContainer, range.startOffset);
                return preRange.toString().length;
            })();

            const firstText = text.slice(0, cursorPosition).trim();
            const secondText = text.slice(cursorPosition).trim();

            if(!firstText || !secondText){
                return;
            }

            const originalStart = timeStringToSeconds(subtitles[index].start);
            const originalEnd = timeStringToSeconds(subtitles[index].end);

            const middleTime = originalStart + ((originalEnd - originalStart) / 2);

            const middleTimeString = secondsToTimeString(middleTime);

            subtitles[index].text = firstText;
            subtitles[index].end = middleTimeString;

            subtitles.splice(index + 1, 0, {
                start: middleTimeString,
                end: secondsToTimeString(originalEnd),
                text: secondText
            });

            srtText = buildSrt(subtitles);

            editorList.innerHTML = "";

            subtitles.forEach((subtitle, newIndex) => {

                const newItem = document.createElement("div");

                newItem.className = "subtitleEditorItem";
                newItem.contentEditable = "true";
                newItem.textContent = subtitle.text || "";
                newItem.dataset.index = newIndex;

                newItem.addEventListener("focus", () => {

                    currentSubtitleIndex = newIndex;

                    const startTime = timeStringToSeconds(subtitle.start);

                    if(isFinite(startTime)){
                        video.currentTime = startTime;
                    }

                    overlay.textContent = newItem.textContent;
                });

                newItem.addEventListener("input", () => {

                    subtitles[newIndex].text = newItem.innerText.trim();

                    srtText = buildSrt(subtitles);

                    if(currentSubtitleIndex === newIndex){
                        overlay.textContent = newItem.innerText.trim();
                    }
                });

                editorList.appendChild(newItem);
            });

            const newItems = editorList.querySelectorAll(".subtitleEditorItem");

            if(newItems[index + 1]){
                newItems[index + 1].focus();

                const newRange = document.createRange();
                newRange.selectNodeContents(newItems[index + 1]);
                newRange.collapse(false);

                const newSelection = window.getSelection();
                newSelection.removeAllRanges();
                newSelection.addRange(newRange);
            }

            status.textContent="تم تقسيم الجملة";
        });

        editorList.appendChild(item);
    });

    editorPanel.style.display = "block";

    status.textContent="وضع إصلاح الترجمة";
};
