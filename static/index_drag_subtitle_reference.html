	<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bestcut</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(180deg,#0b1220 0%,#131c2e 55%,#1a2335 100%);
color:#fff;
font-family:Arial,sans-serif;
height:100vh;
overflow:auto;
}

.app{
display:flex;
flex-direction:column;
height:100vh;
}

header{
height:10vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#111827;
border-bottom:1px solid #273449;
}

header h1{
font-size:34px;
}

header p{
margin-top:4px;
font-size:14px;
color:#9ca3af;
}

.viewer{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:10px 10px 0 10px;
background:#0f172a;
overflow:hidden;
}

.preview{
position:relative;
width:min(90vw,360px);
aspect-ratio:9/16;
background:#000;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

#textLayer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:15;
}

.preview video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

#subtitleOverlay{
position:absolute;
top:46%;
left:50%;
transform:translate(-50%,-50%);
display:block;
width:78%;
max-width:78%;
padding:10px 18px;
background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.22);
border-radius:10px;
backdrop-filter:blur(2px);
-webkit-backdrop-filter:blur(2px);
color:#fff;
font-size:22px;
font-weight:bold;
text-align:center;
line-height:1.4;
white-space:pre-wrap;
word-break:keep-all;
text-shadow:0 2px 8px rgba(0,0,0,.8);
pointer-events:none;
}

#textOverlay{
position:absolute;
left:50%;
bottom:8%;
transform:translateX(-50%);
min-width:220px;
max-width:80%;
padding:14px 20px;
border-radius:16px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(8px);
border:2px dashed rgba(255,255,255,.45);
color:#fff;
font-size:24px;
font-weight:bold;
text-align:center;
outline:none;
display:none;
z-index:20;
pointer-events:none;
}

.selected{
border:2px solid #00bfff !important;
}

.toolbar{
height:100px;
width:95%;
max-width:420px;
margin:0 auto;
background:#1f2937;
border-top:1px solid #334155;
display:flex;
align-items:center;
gap:8px;
padding:10px;
overflow-x:auto;
overflow-y:hidden;
flex-wrap:nowrap;
white-space:nowrap;
border-radius:18px 18px 0 0;
}

#uploadBtn{
height:48px;
padding:0 22px;
border:none;
border-radius:14px;
background:#2563eb;
color:#fff;
font-size:18px;
cursor:pointer;
}

.toolIcon{
width:56px;
height:56px;
border:none;
border-radius:16px;
background:#374151;
color:#ffffff;
font-size:26px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:0.2s;
}

.toolIcon:hover{
background:#4b5563;
transform:scale(1.05);
}

.toolIcon:active{
transform:scale(0.96);
}

#status{
flex:1;
font-size:15px;
color:#d1d5db;
padding-right:8px;
}

#videoFile{
display:none;
}

#result{
display:none;
}

</style>
</head>

<body>

<div class="app">

<header>
<h1>Bestcut</h1>
<p>ذكاء اصطناعي لمعالجة الفيديو والترجمة</p>
</header>

<div class="viewer">

<div class="preview">

<video
id="videoPreview"
controls>
</video>

<div id="textLayer"></div>

<div id="textOverlay" contenteditable="true">
اكتب النص...
</div>

<div id="subtitleOverlay">
النص سيظهر هنا
</div>

</div>

</div>

<div class="toolbar">

<input
type="file"
id="videoFile"
accept="video/*">

<button id="uploadBtn">
بدء المعالجة
</button>

<button
class="toolIcon"
id="pickVideoBtn"
title="اختيار فيديو">
🎬
</button>

<button
class="toolIcon"
id="pickImageBtn"
title="اختيار صورة">
🖼️
</button>

<button
class="toolIcon"
id="addTextBtn"
title="إضافة نص">
✏️
</button>

<button
class="toolIcon"
id="subtitleBtn"
title="أدوات الترجمة">
💬
</button>

<button
class="toolIcon"
id="exportBtn"
title="تحميل الفيديو النهائي">
⬇️
</button>

</div>

<textarea
id="result"
readonly
placeholder="سيظهر النص هنا..."></textarea>

<script>

const result=document.getElementById("result");
const video=document.getElementById("videoPreview");
const overlay=document.getElementById("subtitleOverlay");
const textOverlay=document.getElementById("textOverlay");
textOverlay.onclick=()=>{document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));textOverlay.classList.add("selected");};
const addTextBtn=document.getElementById("addTextBtn");
const uploadBtn=document.getElementById("uploadBtn");
const videoFile=document.getElementById("videoFile");
const pickVideoBtn=document.getElementById("pickVideoBtn");

pickVideoBtn.onclick=()=>{
videoFile.click();
};

addTextBtn.onclick=()=>{
const copy=textOverlay.cloneNode(true);
copy.removeAttribute("id");
copy.contentEditable="true";
copy.style.pointerEvents="auto";
copy.style.display="block";
copy.textContent="";
textLayer.appendChild(copy);
copy.focus();
copy.onclick=()=>{document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));copy.classList.add("selected");};
copy.tabIndex=0;
};

videoFile.onchange=()=>{
if(videoFile.files.length){
video.src=URL.createObjectURL(videoFile.files[0]);
status.textContent="تم اختيار الفيديو";
uploadBtn.textContent="ابدء المعالجة";
}
};

uploadBtn.onclick=async()=>{
status.textContent="جاري المعالجة...";
uploadBtn.textContent="جاري المعالجة...";

if(videoFile.files.length===0){
status.textContent="اختر فيديو أولاً";
return;
}

const formData=new FormData();
formData.append("file",videoFile.files[0]);

try{

const response=await fetch("/transcribe",{
method:"POST",
body:formData
});

const data=await response.json();

status.textContent="تمت المعالجة";
uploadBtn.textContent="تمت المعالجة";

if(data.text){
result.value=data.text;
}

if(data.subtitles){

video.ontimeupdate=()=>{

const t=video.currentTime;

const current=data.subtitles.find(s=>{

const a=s.start.replace(",",".").split(":");
const b=s.end.replace(",",".").split(":");

const start=(+a[0])*3600+(+a[1])*60+parseFloat(a[2]);
const end=(+b[0])*3600+(+b[1])*60+parseFloat(b[2]);

return t>=start && t<=end;

});

overlay.textContent = current ? current.text.replace(/^\s*\[?\d+\]?\s*/, "") : "";

};

}

}catch(e){

status.textContent="فشلت المعالجة";
uploadBtn.textContent="فشلت المعالجة";

}

};

let dragging=false;
let startX=0,startY=0;
let startLeft=50,startTop=46;

overlay.style.touchAction="none";
overlay.style.pointerEvents="auto";

overlay.addEventListener("touchstart",e=>{
dragging=true;
const t=e.touches[0];
startX=t.clientX;
startY=t.clientY;

const r=overlay.getBoundingClientRect();
const p=video.parentElement.getBoundingClientRect();

startLeft=((r.left+r.width/2-p.left)/p.width)*100;
startTop=((r.top+r.height/2-p.top)/p.height)*100;

e.preventDefault();
});

overlay.addEventListener("touchmove",e=>{
if(!dragging)return;

const t=e.touches[0];
const p=video.parentElement.getBoundingClientRect();

overlay.style.transform="translate(-50%,-50%)";
overlay.style.left=(startLeft+(t.clientX-startX)/p.width*100)+"%";
overlay.style.top=(startTop+(t.clientY-startY)/p.height*100)+"%";

e.preventDefault();
});

overlay.addEventListener("touchend",()=>{
dragging=false;
});

</script>

</div>

</body>

</html>
